
 trigger:
  branches:
    include:
      - main

variables:
  terraformWorkingDirectory: 'infra'
  environment: 'staging'

stages:

##############################
# Stage 1: Validate & Plan
##############################
- stage: ValidateAndPlan
  displayName: Terraform Validate & Plan
  jobs:
    - job: TerraformPlan
      displayName: Validate and Plan Terraform
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: Install Terraform & Run Plan
          inputs:
            azureSubscription: 'terraform-acr'
            scriptType: bash
            scriptLocation: inlineScript
            workingDirectory: $(terraformWorkingDirectory)
            inlineScript: |
              echo "Installing Terraform..."
              sudo apt-get update -y
              sudo apt-get install -y gnupg software-properties-common curl unzip
              curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update && sudo apt-get install terraform -y
              terraform -version

              echo "Running Terraform Init..."
              terraform init

              echo "Validating..."
              terraform validate

              echo "Planning..."
              terraform plan -out=tfplan -input=false -var="subscription_id=$(ARM_SUBSCRIPTION_ID)"

        - publish: $(terraformWorkingDirectory)/tfplan
          artifact: tfplan


##############################
# Stage 2: Apply
##############################
- stage: Apply
  displayName: Terraform Apply (Release)
  dependsOn: ValidateAndPlan
  condition: succeeded()
  jobs:
    - deployment: ApplyTerraform
      displayName: Apply Terraform to Azure
      environment: 'staging'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - download: current
                artifact: tfplan

              - task: AzureCLI@2
                displayName: Install Terraform & Apply
                inputs:
                  azureSubscription: 'terraform-acr'
                  scriptType: bash
                  scriptLocation: inlineScript
                  workingDirectory: $(terraformWorkingDirectory)
                  inlineScript: |
                    echo "Installing Terraform..."
                    sudo apt-get update -y
                    sudo apt-get install -y gnupg software-properties-common curl unzip
                    curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
                    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                    sudo apt-get update && sudo apt-get install terraform -y
                    terraform -version

                    echo "Init..."
                    terraform init

                    echo "Apply..."
                    terraform apply -auto-approve tfplan
